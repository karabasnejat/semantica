[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "semantica-wiki"
version = "0.1.0"
description = "Graph-native repository wiki proof of concept powered by Semantica"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "bleach>=6.2",
  "fastapi>=0.115",
  "GitPython>=3.1.40",
  "markdown>=3.7",
  "semantica[explorer]>=0.6.8",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
semantica-wiki = "semantica_wiki.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/semantica_wiki"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
