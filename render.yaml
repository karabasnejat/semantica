services:
  - type: web
    name: semantica-wiki-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -e .
    startCommand: uvicorn semantica_wiki.web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SEMANTICA_CORS_ALLOW_ORIGINS
        sync: false
